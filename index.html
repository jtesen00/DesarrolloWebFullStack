<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayra Academy — Cursos y talleres en línea con instructores peruanos</title>
  <meta name="description" content="Plataforma peruana de cursos y talleres en vivo. Explora el catálogo, mira una clase muestra gratis y recibe una ruta de aprendizaje recomendada.">
  <meta name="theme-color" content="#0A1226">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_PE">
  <meta property="og:site_name" content="Wayra Academy">
  <meta property="og:title" content="Wayra Academy — Cursos y talleres en línea con instructores peruanos">
  <meta property="og:description" content="Cursos y talleres en vivo de desarrollo web, datos, diseño y negocios. Prueba una clase gratis.">
  <meta name="twitter:card" content="summary">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/logo-wayra.svg" type="image/svg+xml">

  <!-- Aplica el tema oscuro antes del primer cuadro para evitar parpadeos visuales -->
  <script>
    try {
      var temaGuardado = localStorage.getItem("wayra-tema");
      var prefiereOscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (temaGuardado === "oscuro" || (temaGuardado === null && prefiereOscuro)) {
        document.documentElement.classList.add("tema-oscuro");
      }
    } catch (e) {
      /* Si localStorage está bloqueado, se mantiene el tema por defecto sin fallar */
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript>Wayra Academy necesita JavaScript para mostrar el catálogo y las herramientas interactivas.</noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
