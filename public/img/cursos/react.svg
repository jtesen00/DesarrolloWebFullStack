<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Semana 4 (Plan B). Portada plana del curso para el carrusel de
       index.html. Colores de los tokens de SISTEMA-DE-DISENO.md. -->
  <rect width="800" height="500" fill="#E4E9EF"/>
  <!-- átomo: componentes que orbitan un estado -->
  <g transform="translate(400,250)" fill="none" stroke="#1B2A4A" stroke-width="12">
    <ellipse rx="190" ry="70"/>
    <ellipse rx="190" ry="70" transform="rotate(60)"/>
    <ellipse rx="190" ry="70" transform="rotate(-60)"/>
  </g>
  <circle cx="400" cy="250" r="34" fill="#C0006B"/>
  <circle cx="590" cy="250" r="16" fill="#F2B705"/>
</svg>
